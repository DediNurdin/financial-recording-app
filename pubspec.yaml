name: financial_recording
description: "Aplikasi pencatatan keuangan pribadi (SQLite + export PDF)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image: ">=4.0.0 <4.11.0"
  intl: ^0.20.2
  path: ^1.9.1
  pdf: ^3.12.0
  printing: ^5.14.3
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icons/launcher/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/launcher/adaptive_foreground.png
  min_sdk_android: 21
